# Home Ambient YAML file for ESPHome Compiler
# place below autogenerated lines
    
# BME68X I2C bus
i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 400kHz
  scan: true
  id: i2c_a

# Display SPI bus
spi:
  id: spi_a
  clk_pin: GPIO2
  mosi_pin: GPIO5

# BME68X Device
bme68x_bsec2_i2c:
  i2c_id: i2c_a
  address: 0x77
  model: bme680
  operating_age: 28d
  sample_rate: ULP
  supply_voltage: 3.3V
  state_save_interval: 6h

sensor:
  # Voltage system monitor
  - platform: adc
    pin: GPIO1
    name: "VCC"
    attenuation: 12db
    accuracy_decimals: 2
    unit_of_measurement: "V"
    update_interval: 15s
    filters:
      - sliding_window_moving_average:
          window_size: 8
          send_every: 8
      - multiply: 2.470
      - delta: 0.1

  # Analog temperature monitor
  - platform: adc
    pin: GPIO0
    name: "Temperature 2 raw"
    id: temeprature_2_raw
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 10s

  # Home parameters
  - platform: homeassistant
    id: grid_energy_today_id
    entity_id: sensor.grid_monitor_energy
  - platform: homeassistant
    id: grid_energy_month_id
    entity_id: sensor.grid_monitor_monthly_energy

  # Bedroom parameters
  - platform: homeassistant
    id: bedroom_temp_id
    entity_id: sensor.bed_room_temperature
  - platform: homeassistant
    id: bedroom_humi_id
    entity_id: sensor.bed_room_humidity

  # Street parameters
  - platform: homeassistant
    id: street_temp_id
    entity_id: sensor.street_temperature
  - platform: homeassistant
    id: street_humi_id
    entity_id: sensor.street_humidity
  - platform: homeassistant
    id: plant_soil_moisture
    entity_id: sensor.planta1_soil_moisture

  - platform: copy
    source_id: temeprature_2_raw
    name: "Temperature 2"
    unit_of_measurement: "°C"
    filters:
      - sliding_window_moving_average:
          window_size: 12
          send_every: 12
      - multiply: 1000
      #- lambda: return (1567 - x) / (8.1f);
      - lambda: return (1575 - x) / (8.1f);
      - delta: 0.2

  # BME68X Sensor reading
  # Temperature, humidity, pressure air quality sensor
  - platform: bme68x_bsec2
    temperature:
      id: temperature_sensor
      name: "Temperature"
      accuracy_decimals: 1
      filters: 
        - delta: 0.2
    pressure:
      id: pressure_sensor
      name: "Pressure"
      unit_of_measurement: mbar
      accuracy_decimals: 0
      filters: 
        - delta: 1
    humidity:
      id: humidity_sensor
      name: "Humidity"
      accuracy_decimals: 0
      filters: 
        - delta: 1
    co2_equivalent:
      name: "CO2 Equivalent"
      accuracy_decimals: 0
    breath_voc_equivalent:
      name: "Breath VOC Equivalent"

  # Virtual power sensor
  # Emulates a power sensor to use with
  # time integration and get energy
  # consumed while heating.
  - platform: template
    name: "Power"
    id: thermostat_power
    state_class: measurement
    device_class: power
    unit_of_measurement: "W"
    accuracy_decimals: 0

  # Virtual energy sensor
  # By integrating the power the energy
  # is calculated and easly showed by HA
  - platform: integration
    name: "Energy"
    sensor: thermostat_power
    time_unit: h
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    integration_method: left
    filters:
      - multiply: 0.001

# RGB ESP32-C3 board
# Optional light for debugging or 
# show warnings and errors
light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    rgb_order: GRB
    pin: GPIO8
    num_leds: 1
    chipset: SK6812
    name: "RGB"

# Heating relay
# Also manipulates the virtual
# power sensor
switch:
  - platform: gpio
    id: heater_switch
    pin: GPIO4
    name: "Heater"

    on_turn_on:
      - sensor.template.publish:
          id: thermostat_power
          state: 2300

    on_turn_off:
      - sensor.template.publish:
          id: thermostat_power
          state: 0

# Climate ESPHome integration
# Makes most of main work
climate:
  - platform: thermostat
    name: "Thermostat"
    id: ha_thermostat
    sensor: temperature_sensor
    visual:
      min_temperature: 10
      max_temperature: 28
      temperature_step: 0.2

    min_heating_off_time: 30s
    min_heating_run_time: 5s
    min_idle_time: 30s
    heat_deadband: 0.3
    heat_overrun: 0.5
    
    heat_action:
      - switch.turn_on: heater_switch
      - light.turn_on:
                  id: rgb_led
                  red: 1.0
                  green: 0.0
                  blue: 0.0
                  brightness: 0.5
    idle_action:
      - switch.turn_off: heater_switch
      - light.turn_off: rgb_led

    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 12 °C

# Display fonts
font:
  - file:
      type: gfonts
      family: Source Code Pro
      weight: 600
    id: roboto_20
    size: 20
  - file:
      type: gfonts
      family: Source Code Pro
      weight: 800
    id: roboto_26
    size: 26
  - file:
      type: local
      path: "materialdesignicons-webfont.ttf"
    id: icons_font
    size: 24
    glyphs:
      - "\U000F024A" # mdi-flower
      - "\U000F050F" # mdi-thermometer
      - "\U000F058E" # mdi-water-percent

# Floor plan image
image:
  - file: "P_FC.bmp"
    type: binary
    id: floor_plan
    invert_alpha: false

# 4.2" e-paper display implementation
display:
  - platform: epaper_spi
    spi_id: spi_a
    model: WeAct-4.2in-3c
    dimensions:
      width: 400
      height: 300
    cs_pin: GPIO3
    busy_pin: GPIO18
    dc_pin: GPIO10
    reset_pin: GPIO19
    reset_duration: 2ms
    update_interval: 900s
    full_update_every: 1

    lambda: |-
      auto color_print = COLOR_OFF;
      auto color_back = COLOR_ON;
      auto color_red = Color(255, 0, 0);
      it.fill(color_back);
      it.image(0, 0, id(floor_plan));

      it.printf(240,   0, id(roboto_20), color_print, "Hoy %6.0f Wh", id(grid_energy_today_id).state);
      it.printf(240,  20, id(roboto_20), color_red, "Mes %6.0f Wh", id(grid_energy_month_id).state);

      //Main room
      it.printf( 60, 170, id(roboto_20), color_print, "%.1f°", id(temperature_sensor).state);
      it.printf( 66, 190, id(roboto_20), color_print, "%.0f%%", id(humidity_sensor).state);
      //Bathroom
      //it.printf(170, 190, id(roboto_20), color_print, "%.1f°", id(temperature_sensor).state);
      //it.printf(178, 210, id(roboto_20), color_print, "%.0f%%", id(humidity_sensor).state);
      //Bed room
      it.printf(259, 215, id(roboto_20), color_print, "%.1f°", id(bedroom_temp_id).state);
      it.printf(266, 235, id(roboto_20), color_print, "%.0f%%", id(bedroom_humi_id).state);
      //Exterior
      it.rectangle(320, 115, 70, 70, color_print);
      it.printf(330, 115, id(roboto_20), color_print, "Ext.");
      it.printf(327, 140, id(roboto_20), color_print, "%.1f°", id(street_temp_id).state);
      it.printf(335, 160, id(roboto_20), color_print, "%.0f%%", id(street_humi_id).state);
      //Plant1
      it.print(315, 80, id(icons_font), color_print, "\U000F024A");
      it.printf(345, 80, id(roboto_20), color_print, "%.0f%%", id(plant_soil_moisture).state);
      it.line(315, 82, 385, 82);
